
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JOO WEAR</title>
    <link rel="stylesheet" href="styleee.css">
</head>

<body>

    <header>
        <a href="wear store.html" class="logo">JOO WEAR</a>

        <nav>
            <a href="wear store.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="register.html">Create Account</a>
            <a href="login.html">Login</a>
            <a href="cart.html">Cart 🛒</a>
        </nav>
    </header>

    <main class="register-container">

        <form class="register-form" onsubmit="loginUser(event)">

            <h1>Welcome Back</h1>

            <p>Login to your JOO WEAR account</p>

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">LOGIN</button>

            <p class="login-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </form>

    </main>

    <footer>
        <h2>JOO WEAR</h2>
        <p>Your style, your identity.</p>
        <p>© 2026 JOO WEAR. All Rights Reserved.</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
