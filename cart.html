<script>
    let cart = getCart();

    function displayCart() {
        const container = document.getElementById("cart-items");
        const totalElement = document.getElementById("total");

        container.innerHTML = "";
        let total = 0;

        if (cart.length === 0) {
            container.innerHTML = "<p>Your cart is empty.</p>";
        }

        cart.forEach((item, index) => {
            const price = Number(item.price) || 0;
            const quantity = Number(item.quantity) || 1;
            const subtotal = price * quantity;

            total += subtotal;

            const itemElement = document.createElement("div");
            itemElement.className = "cart-item";

            itemElement.innerHTML = `
                <h3></h3>
                <p class="color"></p>
                <p class="size"></p>
                <p class="quantity"></p>
                <p class="price"></p>
                <p class="subtotal"></p>
                <button type="button">Remove</button>
            `;

            itemElement.querySelector("h3").textContent = item.name;
            itemElement.querySelector(".color").textContent =
                "Color: " + (item.color || "Not selected");
            itemElement.querySelector(".size").textContent =
                "Size: " + (item.size || "Not selected");
            itemElement.querySelector(".quantity").textContent =
                "Quantity: " + quantity;
            itemElement.querySelector(".price").textContent =
                "Price: " + price + " EGP each";
            itemElement.querySelector(".subtotal").textContent =
                "Subtotal: " + subtotal + " EGP";

            itemElement.querySelector("button").addEventListener("click", function () {
                removeItem(index);
            });

            container.appendChild(itemElement);
        });

        totalElement.textContent = "Total: " + total + " EGP";
    }

    function removeItem(index) {
        cart.splice(index, 1);
        saveCart(cart);
        displayCart();
    }

        if (cart.length === 0) {
            alert("Your cart is empty!");
            return;
        }

        alert("Checkout is a demo. No real order has been placed.");
    }

    displayCart();
</script>
